# ps2_recomp configuration for The Getaway, NTSC-U (SCUS-97133).
#
# Paths are relative to the repository root; tools/scripts/recompile.ps1 runs
# ps2_recomp from there. Every address below belongs to this exact ELF: they
# are not portable to the PAL releases.
#
# This file will be regenerated by PS2Recomp's Ghidra exporter
# (external/PS2Recomp/ps2xRecomp/tools/ghidra/ExportPS2Functions.java) and
# then edited by hand. See docs/PIPELINE.md.

[general]
input = "iso/extracted/SCUS_971.33"
ghidra_output = "recomp/config/SCUS-97133.functions.csv"
output = "recomp/generated/"
single_file_output = false
low_memory_mode = false
output_worker_threads = 0

patch_syscalls = false
patch_cop0 = true
patch_cache = true

# Runtime handlers bound by name or by address ("sceCdRead@0x00123456").
stubs = []

# Functions not to recompile (become TODO wrappers).
skip = []

[patches]
# { address = "0x00100000", value = "0x00000000" }
instructions = []
